# Lint for the package, pipelines, infrastructure scripts and tests. Function bodies in src/dfm were
# copied from the modeling scripts unchanged, so their statement style (several short statements on
# one line, single-letter names) is accepted rather than rewritten.
line-length = 160
target-version = "py312"
extend-exclude = ["ml", "data_source", "analytics", "docs", "reference", "runs", "dist"]

[lint]
select = ["E", "F", "W", "I", "B006", "B008"]
ignore = ["E701", "E702", "E731", "E741"]

[lint.isort]
known-first-party = ["dfm", "data_source"]
