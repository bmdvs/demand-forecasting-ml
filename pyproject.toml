[project]
name = "mfg-demand-forecasting"
version = "0.1.0"
description = "Demand forecasting and ERP data quality for an industrial equipment manufacturer."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "faker>=20.0",
    "duckdb>=1.0,<2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "optuna>=3.0",
    "shap>=0.45",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data_source"]

# Lint for the package and its tests, the pipelines and the infrastructure scripts. Function bodies in
# src/dfm were copied from the modeling scripts unchanged, so their statement style (several short
# statements on one line, single-letter names) is accepted rather than rewritten.
[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["ml", "data_source", "analytics", "docs", "reference", "runs", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B006", "B008"]
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["dfm", "data_source"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
