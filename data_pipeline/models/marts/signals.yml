version: 2

# Demand-signal models: the order book, families, shortages, installed base, supplier
# lead times and the plant calendar. Grain tests on every model; point-in-time and
# reconciliation tests are in tests/.

models:
  - name: dim_week
    columns:
      - name: week
        tests: [unique, not_null]

  - name: int_bom_resolved
    tests:
      - unique_combination:
          arguments:
            columns: [parent, component_item, valid_from, row_source]

  - name: int_job_requirements
    tests:
      - unique_combination:
          arguments:
            columns: [order_id, canonical_item_number]
    columns:
      - name: required_date
        tests: [not_null]

  - name: int_receipt_windows
    tests:
      - unique_combination:
          arguments:
            columns: [key_type, key_id, receipts_to_date]

  - name: int_leadtime_weekly
    tests:
      - unique_combination:
          arguments:
            columns: [key_type, key_id, week]

  - name: mart_item_leadtime_weekly
    tests:
      - unique_combination:
          arguments:
            columns: [canonical_item_number, week]
    columns:
      - name: lt_roll8
        tests: [not_null]
      - name: h_weeks
        tests: [not_null]

  - name: mart_supplier_leadtime_weekly
    tests:
      - unique_combination:
          arguments:
            columns: [supplier_id, week]

  - name: int_firm_contributions
    tests:
      - unique_combination:
          arguments:
            columns: [origin, canonical_item_number, order_id]

  - name: mart_firm_requirements_weekly
    tests:
      - unique_combination:
          arguments:
            columns: [canonical_item_number, origin]

  - name: int_item_family
    columns:
      - name: canonical_item_number
        tests: [unique, not_null]
      - name: family
        tests: [not_null]

  - name: mart_family_usage_weekly
    tests:
      - unique_combination:
          arguments:
            columns: [family, week]

  - name: mart_product_family_weekly
    tests:
      - unique_combination:
          arguments:
            columns: [product_family, week]

  - name: mart_shortage_weekly
    tests:
      - unique_combination:
          arguments:
            columns: [canonical_item_number, week]

  - name: int_product_installed_base
    tests:
      - unique_combination:
          arguments:
            columns: [product_number, month]

  - name: mart_installed_base
    tests:
      - unique_combination:
          arguments:
            columns: [product_family, month]

  - name: mart_item_installed_base
    tests:
      - unique_combination:
          arguments:
            columns: [canonical_item_number, month]
