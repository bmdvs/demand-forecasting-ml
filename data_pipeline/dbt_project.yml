name: 'demand_forecasting'
version: '2.0.0'
profile: 'demand_forecasting'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Observation window, kept in sync with data_source/generate/config.py.
  start_date: '2023-01-01'
  history_end: '2025-12-31'        # last day of the history; end of the remediation period
  remediation_start: '2025-10-22'  # the ten-week cleanup that closed the history
  as_of_date: '2026-06-30'         # "today" for the inventory position
  # Detection thresholds used by the data-quality models, as documented in the audit.
  dead_lookback_months: 24         # no more than one movement in this window marks a dead record
  stale_lead_gap_days: 3           # actual lead time differs from the master by more than this
  stale_rop_min_units: 5           # recomputed reorder point differs by at least this many units
  stale_rop_min_share: 0.30        # ...and by at least this share of the point on file
  duplicate_gap_days: 1            # an identical posting within this many days is a duplicate
  # ABC cut points on cumulative annual usage value.
  abc_a_cum: 0.80
  abc_b_cum: 0.95
  # Demand-signal marts, kept in sync with data_source/generate/config.py.
  first_monday: '2022-12-26'       # the Monday of the first history week
  forward_end: '2026-06-30'        # last day of the forward window
  first_origin_week: 13            # firm-requirement origins start at this history week
  shutdown_weeks: ['2023-07-03', '2023-12-25', '2024-07-01', '2024-12-23', '2025-06-30', '2025-12-22', '2026-06-29']
  ib_age_cut_1: 12                 # installed-base failure weight by unit age, months
  ib_age_cut_2: 24
  ib_weight_1: 0.25
  ib_weight_2: 0.65
  ib_weight_3: 1.00
  ib_opening_years: 8              # years of builds in the field when the history opens (estimate)
  service_backorder_days: 5        # a service line shipped more than this many days after order
  lt_window: 8                     # receipts in the rolling lead-time statistics
  lt_min_receipts: 4               # below this, the corrected master stands in
  t1_unrecorded_share: 0.14        # share of an affected item's usage that escapes the ledger

models:
  demand_forecasting:
    staging:
      +materialized: view
    data_quality:
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table
